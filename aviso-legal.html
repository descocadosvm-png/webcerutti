<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso Legal | Lacteos Cerutti</title>
    <style>
        :root {
            --primario: #0a192f;
            --acento: #c2a371;
            --texto: #334155;
            --bg: #f8fafc;
            --white: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--texto);
            line-height: 1.65;
        }
        .legal-wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 24px 56px;
        }
        .kicker {
            color: var(--acento);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }
        h1 {
            margin: 0 0 24px;
            font-family: 'Libre Baskerville', serif;
            font-size: 2.35rem;
            color: var(--primario);
        }
        section {
            background: var(--white);
            border: 1px solid rgba(194, 163, 113, 0.26);
            border-radius: 14px;
            padding: 22px 20px;
            margin-bottom: 16px;
        }
        h2 {
            margin: 0 0 10px;
            color: var(--primario);
            font-size: 1.05rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        p { margin: 0 0 10px; font-size: 1rem; }
        p:last-child { margin-bottom: 0; }
        .legal-nav {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .legal-nav a {
            text-decoration: none;
            color: var(--primario);
            font-weight: 700;
        }
        .legal-nav a:hover { color: var(--acento); }
        @media (max-width: 768px) and (orientation: portrait) {
            .legal-wrap { padding: 22px 14px 40px; }
            h1 { font-size: 1.88rem; }
            section { padding: 16px 14px; border-radius: 10px; }
            p { font-size: 0.98rem; }
            .legal-nav { gap: 10px; }
        }
    </style>
</head>
<body>
    <main class="legal-wrap"></main>

            const t = i18n[lang] || i18n.es;
            document.documentElement.lang = lang;

            const wrap = document.querySelector('.legal-wrap');
            wrap.innerHTML = `

</body>
